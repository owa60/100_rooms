<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>100 Комнат — Roguelike</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#eef2ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
#game{width:min(1100px,96vw);min-height:680px;background:linear-gradient(145deg,#111522,#0c0f18);border:1px solid #252b3c;border-radius:22px;box-shadow:0 25px 80px #0008;overflow:hidden}
header{padding:18px 24px;border-bottom:1px solid #252b3c;display:flex;gap:18px;align-items:center;justify-content:space-between}
h1{font-size:24px;margin:0}.sub{color:#8791aa;font-size:13px}
.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:#171c29;padding:8px 12px;border-radius:10px;font-size:14px}
main{display:grid;grid-template-columns:1fr 310px;min-height:600px}
#scene{padding:28px;position:relative}.roomtop{display:flex;justify-content:space-between;color:#8f99b2;font-size:14px}
.room{margin-top:16px;min-height:470px;border-radius:20px;background:radial-gradient(circle at 50% 30%,#252d42,#121724 55%,#0d111a);border:1px solid #293248;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;position:relative;overflow:hidden}
.room:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 96%,#ffffff04 96%);background-size:100% 18px;pointer-events:none}
.icon{font-size:76px;filter:drop-shadow(0 10px 20px #0008);z-index:1}
h2{font-size:30px;margin:12px 0 5px;z-index:1}.desc{max-width:560px;color:#aeb7cb;line-height:1.5;z-index:1}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;z-index:2}
button{border:0;border-radius:11px;padding:12px 18px;background:#20283a;color:#fff;font-weight:700;cursor:pointer;transition:.15s;font-size:14px}
button:hover{transform:translateY(-2px);background:#2b3650}button.primary{background:#6d5dfc}button.danger{background:#b83c58}button.good{background:#2d9b68}button:disabled{opacity:.4;cursor:not-allowed;transform:none}
#side{border-left:1px solid #252b3c;padding:20px;background:#0d1018}
.panel{background:#141925;border:1px solid #252c3e;border-radius:14px;padding:15px;margin-bottom:12px}
.panel h3{margin:0 0 12px;font-size:14px;color:#aeb8ce}
.bar{height:9px;background:#242a38;border-radius:99px;overflow:hidden}.fill{height:100%;transition:.3s}.hp{background:#ef526f}.xp{background:#7c6cff}
.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0;font-size:13px;color:#aeb6c9}
.log{height:190px;overflow:auto;font-size:12px;line-height:1.5;color:#9da7bc}.log div{margin-bottom:6px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222838}.item:last-child{border:0}
.badge{font-size:11px;padding:4px 7px;background:#252d40;border-radius:7px;color:#cbd3e6}
#overlay{position:fixed;inset:0;background:#05060acc;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{width:min(520px,95vw);background:#131827;border:1px solid #30384e;border-radius:20px;padding:28px;text-align:center;box-shadow:0 30px 100px #000}
.modal .big{font-size:70px}.modal h2{margin-top:4px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.choice button{text-align:left}
@media(max-width:800px){main{grid-template-columns:1fr}#side{border-left:0;border-top:1px solid #252b3c}.room{min-height:420px}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="game">
<header>
  <div><h1>🏰 100 КОМНАТ</h1><div class="sub">Пройди подземелье. Не умри.</div></div>
  <div class="stats"><div class="stat">Комната <b id="roomNum">1</b>/100</div><div class="stat">💰 <b id="gold">0</b></div><div class="stat">⚔️ <b id="atk">8</b></div></div>
</header>
<main>
<section id="scene">
  <div class="roomtop"><span id="roomType">Неизвестно</span><span id="seed"></span></div>
  <div class="room">
    <div class="icon" id="icon">🚪</div>
    <h2 id="title">Вход</h2>
    <div class="desc" id="desc">Ты стоишь перед первой дверью...</div>
    <div class="buttons" id="buttons"></div>
  </div>
</section>
<aside id="side">
  <div class="panel">
    <h3>ПЕРСОНАЖ</h3>
    <div class="row"><span>❤️ Здоровье</span><b id="hpText">100/100</b></div><div class="bar"><div id="hpBar" class="fill hp" style="width:100%"></div></div>
    <div class="row"><span>✨ Опыт</span><b id="xpText">0/100</b></div><div class="bar"><div id="xpBar" class="fill xp" style="width:0%"></div></div>
    <div class="row"><span>⭐ Уровень</span><b id="level">1</b></div>
  </div>
  <div class="panel"><h3>СНАРЯЖЕНИЕ</h3><div id="items"></div></div>
  <div class="panel"><h3>ЖУРНАЛ</h3><div class="log" id="log"></div></div>
  <button style="width:100%" onclick="saveGame()">💾 Сохранить</button>
  <button style="width:100%;margin-top:8px" onclick="restart()">🔄 Новая игра</button>
</aside>
</main>
</div>

<div id="overlay"><div class="modal">
  <div class="big" id="modalIcon">☠️</div><h2 id="modalTitle">Конец</h2><p id="modalText"></p><div class="choice" id="modalButtons"></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
let game;

function fresh(){
  game={room:1,hp:100,maxHp:100,atk:8,def:0,gold:20,xp:0,level:1,potions:2,weapon:"Старый меч",armor:"Одежда",rooms:[],log:[],seed:Math.floor(Math.random()*999999)};
  game.rooms=Array.from({length:100},(_,i)=>makeRoom(i+1));
  log("🚪 Ты вошёл в подземелье. Впереди 100 комнат.");
  render();
}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function makeRoom(n){
  if(n===100)return {type:"boss"};
  if(n%10===0)return {type:"boss"};
  let r=Math.random();
  if(r<.43)return {type:"enemy"};
  if(r<.63)return {type:"treasure"};
  if(r<.76)return {type:"trap"};
  if(r<.88)return {type:"event"};
  return {type:"rest"};
}
function log(x){game.log.unshift(x);game.log=game.log.slice(0,40);$("log").innerHTML=game.log.map(v=>`<div>${v}</div>`).join("")}
function render(){
  $("roomNum").textContent=game.room;$("gold").textContent=game.gold;$("atk").textContent=game.atk;
  $("hpText").textContent=`${game.hp}/${game.maxHp}`;$("hpBar").style.width=Math.max(0,game.hp/game.maxHp*100)+"%";
  $("xpText").textContent=`${game.xp}/${100+game.level*30}`;$("xpBar").style.width=Math.min(100,game.xp/(100+game.level*30)*100)+"%";$("level").textContent=game.level;
  $("items").innerHTML=`<div class="item">🗡️ ${game.weapon}<span class="badge">+${game.atk-8} ATK</span></div><div class="item">🛡️ ${game.armor}<span class="badge">+${game.def} DEF</span></div><div class="item">🧪 Зелья <span class="badge">${game.potions}</span></div>`;
  $("seed").textContent="#"+game.seed;
  const r=game.rooms[game.room-1]; showRoom(r);
}
function showRoom(r){
  let data={enemy:["👹","Враг","В темноте раздаётся рычание.","⚔️ Бой"],treasure:["🎁","Сундук","Старый сундук покрыт пылью. Внутри может быть что угодно.","Открыть"],trap:["☠️","Ловушка","Пол подозрительно скрипит. Кажется, здесь что-то не так.","Пройти"],event:["❓","Странная встреча","Ты замечаешь нечто необычное в этой комнате.","Исследовать"],rest:["🔥","Тихая комната","Здесь неожиданно спокойно. Можно перевести дух.","Отдохнуть"],boss:["👑","БОСС","Дверь закрывается. Перед тобой хранитель десятой комнаты.","⚔️ Сразиться"]}[r.type];
  $("roomType").textContent=r.type==="boss"?"⚠️ ОПАСНО":"КОМНАТА";
  $("icon").textContent=data[0];$("title").textContent=data[1];$("desc").textContent=data[2];
  $("buttons").innerHTML=`<button class="primary" onclick="act()">${data[3]}</button>${game.potions>0?'<button onclick="potion()">🧪 Выпить зелье</button>':''}`;
}
function next(){if(game.room>=100){win();return}game.room++;saveGame(true);render()}
function gainXP(n){game.xp+=n;let need=100+game.level*30;if(game.xp>=need){game.xp-=need;game.level++;game.maxHp+=15;game.hp=game.maxHp;game.atk+=3;log(`✨ Уровень повышен! Теперь ${game.level}.`)}}
function act(){
 const r=game.rooms[game.room-1];
 if(r.type==="enemy"||r.type==="boss")fight(r.type==="boss");
 else if(r.type==="treasure")treasure();
 else if(r.type==="trap")trap();
 else if(r.type==="event")event();
 else rest();
}
function fight(boss){
 let enemy=boss?{name:"Хранитель",hp:rnd(90,120)+game.level*8,atk:rnd(13,19)+game.level}:{name:pick(["Гоблин","Скелет","Крыса-мутант","Разбойник","Тёмный рыцарь"]),hp:rnd(22,42)+game.level*4,atk:rnd(6,12)+Math.floor(game.level/2)};
 $("title").textContent=enemy.name;$("icon").textContent=boss?"👑":"👹";$("desc").textContent=`HP врага: ${enemy.hp}. Каждый удар может стать последним.`;
 $("buttons").innerHTML=`<button class="danger" onclick="combat(${enemy.hp},${enemy.atk},${boss})">⚔️ Атаковать</button>${game.potions>0?'<button onclick="potion()">🧪 Зелье</button>':''}`;
}
function combat(ehp,eatk,boss){
  let round=0;
  function turn(hp){
    round++; let dmg=Math.max(1,game.atk+rnd(-2,3)); hp-=dmg;
    if(hp<=0){let reward=boss?150:rnd(8,25);game.gold+=reward;gainXP(boss?100:35);log(`⚔️ Победа! +${reward}💰.`);if(boss)log("👑 Хранитель повержен!");next();return}
    let taken=Math.max(1,eatk+rnd(-2,3)-game.def);game.hp-=taken;log(`⚔️ Ты нанёс ${dmg}, получил ${taken} урона.`);
    if(game.hp<=0){game.hp=0;render();lose();return}
    $("desc").textContent=`${boss?"Хранитель":"Враг"} HP: ${hp}. Твой HP: ${game.hp}.`;
    $("buttons").innerHTML=`<button class="danger" onclick="turn(${hp})">⚔️ Атаковать</button>${game.potions>0?'<button onclick="potion();turn('+hp+')">🧪 Зелье</button>':''}`;
    renderStatsOnly();
  }
  turn(ehp);
}
function renderStatsOnly(){ $("gold").textContent=game.gold;$("atk").textContent=game.atk;$("hpText").textContent=`${game.hp}/${game.maxHp}`;$("hpBar").style.width=Math.max(0,game.hp/game.maxHp*100)+"%";$("level").textContent=game.level;$("log").innerHTML=game.log.map(v=>`<div>${v}</div>`).join("")}
function potion(){if(game.potions<=0)return;game.potions--;let heal=rnd(25,40);game.hp=Math.min(game.maxHp,game.hp+heal);log(`🧪 Зелье восстановило ${heal} HP.`);renderStatsOnly();if(game.rooms[game.room-1]) showRoom(game.rooms[game.room-1])}
function treasure(){let roll=Math.random();if(roll<.45){let g=rnd(20,65);game.gold+=g;log(`🎁 В сундуке было ${g} золота!`)}else if(roll<.7){game.atk+=rnd(2,5);game.weapon=pick(["Железный меч","Кривой топор","Светящийся клинок","Острый кинжал"]);log(`🗡️ Ты нашёл ${game.weapon}! Атака увеличена.`)}else if(roll<.9){game.def+=rnd(1,3);game.armor=pick(["Кожаная броня","Кольчуга","Странный доспех"]);log(`🛡️ Найдена ${game.armor}!`)}else{game.potions++;log("🧪 Ты нашёл зелье.");}next()}
function trap(){let dmg=rnd(10,28);if(Math.random()<.25){game.gold+=30;log("😎 Ты заметил ловушку и обошёл её. За дверью лежало 30 золота!")}else{game.hp-=Math.max(1,dmg-game.def);log(`☠️ Ловушка! Ты получил ${Math.max(1,dmg-game.def)} урона.`);if(game.hp<=0){game.hp=0;lose();return}}next()}
function event(){
 let n=rnd(1,4);
 if(n===1){game.hp=Math.min(game.maxHp,game.hp+25);log("👻 Таинственный дух исцелил тебя на 25 HP.");}
 if(n===2){let g=rnd(15,45);game.gold+=g;log(`🧙 Незнакомец подарил тебе ${g} золота.`)}
 if(n===3){game.atk+=2;log("✨ Странный кристалл увеличил атаку на 2.");}
 if(n===4){game.potions++;log("🧪 В старой сумке найдено зелье.");}
 next()
}
function rest(){let h=rnd(18,32);game.hp=Math.min(game.maxHp,game.hp+h);log(`🔥 Ты отдохнул и восстановил ${h} HP.`);if(Math.random()<.3){game.potions++;log("🧪 В костре найдено зелье.")}next()}
function lose(){modal("☠️","Ты погиб",`Ты дошёл до комнаты ${game.room} из 100 и собрал ${game.gold} золота.`,[["🔄 Начать заново",()=>{closeModal();restart()}]])}
function win(){modal("🏆","100 КОМНАТ ПРОЙДЕНЫ!",`Ты победил! Уровень ${game.level}, золото: ${game.gold}, атака: ${game.atk}.`,[["🔥 Ещё раз",()=>{closeModal();restart()}]])}
function modal(icon,title,text,buttons){$("modalIcon").textContent=icon;$("modalTitle").textContent=title;$("modalText").textContent=text;$("modalButtons").innerHTML=buttons.map((b,i)=>`<button class="${i===0?'primary':''}" onclick="window._mb[${i}]()">${b[0]}</button>`).join("");window._mb=buttons.map(b=>b[1]);$("overlay").style.display="flex"}
function closeModal(){$("overlay").style.display="none"}
function saveGame(silent=false){localStorage.setItem("rooms100save",JSON.stringify(game));if(!silent)log("💾 Игра сохранена.");}
function loadGame(){try{let x=JSON.parse(localStorage.getItem("rooms100save"));if(x&&x.room){game=x;render();return true}}catch(e){}return false}
function restart(){localStorage.removeItem("rooms100save");fresh()}
if(!loadGame())fresh();
</script>
</body>
</html>
